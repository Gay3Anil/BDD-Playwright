name: BDD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bdd-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Type-check framework
        run: npx tsc --noEmit

      - name: Run Cucumber scenarios
        run: npm run test:bdd

      - name: Upload Cucumber report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-and-screenshots
          path: |
            reports/cucumber-report.html
            screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14